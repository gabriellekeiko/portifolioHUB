name: Deploy PortfolioHUB

on:
  push:
    branches:
      - main # O site só atualiza quando algo entra na main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload dos Arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Envia todos os arquivos da raiz (como o index.html)

      - name: Deploy Definitivo
        id: deployment
        uses: actions/deploy-pages@v4