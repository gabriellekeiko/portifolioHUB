<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortfolioHUB | Gabrielle Keiko</title>
    <style>
        :root {
            --navy: #071d33;
            --blue: #155e8f;
            --accent: #d9a441;
            --green: #22745a;
            --text: #223044;
            --muted: #64748b;
            --line: #d9e2ec;
            --bg: #f3f6fa;
            --white: #ffffff;
            --shadow: 0 14px 35px rgba(6, 33, 61, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: "Aptos", "Segoe UI", Arial, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
        }

        a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 700;
        }

        a:hover {
            text-decoration: underline;
        }

        .layout {
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr);
            min-height: 100vh;
        }

        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            padding: 28px 22px;
            background: var(--navy);
            color: var(--white);
            overflow-y: auto;
        }

        .sidebar-brand {
            margin-bottom: 30px;
            padding-bottom: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        }

        .sidebar-brand strong {
            display: block;
            font-size: 1.25rem;
            letter-spacing: 0.2px;
        }

        .sidebar-brand span {
            display: block;
            margin-top: 6px;
            color: #b8c7d8;
            font-size: 0.92rem;
        }

        .nav-title {
            margin: 0 0 12px;
            color: #b8c7d8;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .quick-nav {
            display: grid;
            gap: 8px;
        }

        .quick-nav a {
            display: block;
            padding: 10px 12px;
            color: var(--white);
            border-radius: 6px;
            font-weight: 600;
        }

        .quick-nav a:hover {
            background: rgba(255, 255, 255, 0.12);
            text-decoration: none;
        }

        .sidebar-contact {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.18);
        }
